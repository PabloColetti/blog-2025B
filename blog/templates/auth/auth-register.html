{% extends 'layouts/auth-layout.html' %}

{% block title %} Registrao {% endblock title %}

{% block content %} 
  <div class="w-full max-w-lg flex flex-col justify-center gap-4">
    <h1 class="font-bold text-center">Registrarse</h1>
    <form method="post" class="flex flex-col gap-4">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="w-full bg-gray-900 px-4 py-2 rounded-md" type="submit">Aceptar</button>
    </form>
  </div>
{% endblock content %}
